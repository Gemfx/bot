<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Radar Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md">
        <header class="flex justify-between items-center mb-6 mt-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-cyan-400">⚡ Mining Radar</h1>
                <p class="text-xs text-slate-400">Cloud Bot Infrastructure</p>
            </div>
            <span id="connection-badge" class="px-2.5 py-1 text-xs rounded-full bg-emerald-900 text-emerald-300 border border-emerald-700">Online</span>
        </header>

        <!-- Status Cards Container -->
        <div id="accounts-container" class="space-y-4">
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 animate-pulse">
                <div class="h-4 bg-slate-800 rounded w-1/3 mb-2"></div>
                <div class="h-3 bg-slate-800 rounded w-2/3"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App SDK if opened inside Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/mining-status');
                const data = await response.json();
                const container = document.getElementById('accounts-container');
                container.innerHTML = '';

                if (!data.accounts || Object.keys(data.accounts).length === 0) {
                    container.innerHTML = `<div class="p-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-center text-sm">No mining accounts initialized yet.</div>`;
                    return;
                }

                for (const [accountName, bots] of Object.entries(data.accounts)) {
                    let botsHtml = '';
                    for (const [botName, details] of Object.entries(bots)) {
                        const isReady = details.status.includes('READY');
                        const badgeColor = isReady ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
                        
                        botsHtml += `
                            <div class="mt-3 p-3 rounded-lg bg-slate-950/60 border border-slate-800/80">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-sm font-semibold text-slate-200">${botName}</span>
                                    <span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded border ${badgeColor}">${details.status}</span>
                                </div>
                                <p class="text-xs text-slate-400 truncate">Last: "${details.last_response || 'Polling...'}"</p>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 shadow-lg">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-1">
                                <h2 class="font-bold text-slate-100 flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span> ${accountName}
                                </h2>
                            </div>
                            ${botsHtml}
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Failed to fetch status:", err);
                document.getElementById('connection-badge').className = "px-2.5 py-1 text-xs rounded-full bg-rose-900 text-rose-300 border border-rose-700";
                document.getElementById('connection-badge').innerText = "Disconnected";
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 5000); // Poll every 5 seconds
    </script>
</body>
</html>
