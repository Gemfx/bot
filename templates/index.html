<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mining Radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Colors follow the user's Telegram theme automatically (light or dark). */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --surface: var(--tg-theme-secondary-bg-color, #eef1f4);
    --text: var(--tg-theme-text-color, #15191e);
    --hint: var(--tg-theme-hint-color, #6b7480);
    --link: var(--tg-theme-link-color, #2a7bd1);
    --btn: var(--tg-theme-button-color, #2a7bd1);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ready: #1fa463;
    --mining: #cf8a06;
    --bad: #d64545;
    --line: rgba(128, 128, 128, 0.22);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --surface: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #f2f4f6);
      --hint: var(--tg-theme-hint-color, #8d99a6);
      --link: var(--tg-theme-link-color, #6ab3f3);
      --btn: var(--tg-theme-button-color, #5288c1);
      --ready: #3ccf84;
      --mining: #f0b03a;
      --bad: #f06a6a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; }
  p { margin: 0; }
  .hint { color: var(--hint); font-size: 13px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .icon-btn {
    border: 0; background: var(--surface); width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }

  /* Radar — the one memorable element */
  .radar-wrap { display: grid; grid-template-columns: 148px 1fr; gap: 18px; align-items: center; margin-bottom: 22px; }
  .radar {
    position: relative; width: 148px; aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 31%, var(--line) 31.5%, transparent 32.5%),
      radial-gradient(circle, transparent 64%, var(--line) 64.5%, transparent 65.5%),
      var(--surface);
    overflow: hidden;
  }
  .radar::before, .radar::after {
    content: ""; position: absolute; background: var(--line);
  }
  .radar::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .radar::after { top: 50%; left: 0; right: 0; height: 1px; }
  .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 290deg, color-mix(in srgb, var(--ready) 45%, transparent) 360deg);
    animation: spin 4s linear infinite;
  }
  .radar.off .sweep { display: none; }
  .blip {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: var(--mining); z-index: 2;
  }
  .blip.ready { background: var(--ready); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ready) 30%, transparent); }
  .blip.bad { background: var(--bad); }
  .blip.done { background: var(--hint); }
  .radar-center {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; text-align: center;
  }
  .radar-center strong { font-size: 30px; line-height: 1; display: block; }
  .radar-center span { font-size: 12px; color: var(--hint); }
  .summary h2 { margin-bottom: 4px; }
  .summary p + p { margin-top: 2px; }

  /* Switch */
  .switch-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; cursor: pointer; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 13px; background: var(--line); transition: background 0.2s; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch input:checked ~ .track { background: var(--ready); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--link); outline-offset: 2px; }

  /* Sections */
  section { margin-top: 26px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .list { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .row { padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-main { display: flex; align-items: center; gap: 10px; }
  .row-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.ready { color: var(--ready); }
  .status.mining { color: var(--mining); }
  .status.bad { color: var(--bad); }
  .status.done { color: var(--hint); }
  .row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .row-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
  details.reply summary { cursor: pointer; color: var(--link); font-size: 13px; list-style: none; }
  details.reply summary::-webkit-details-marker { display: none; }
  details.reply pre {
    margin: 8px 0 0; padding: 10px; border-radius: 10px; background: var(--bg);
    white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 13px; color: var(--text);
    max-height: 200px; overflow: auto;
  }

  /* Buttons */
  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600;
    background: var(--btn); color: var(--btn-text);
  }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .btn.quiet { background: transparent; color: var(--link); padding-left: 4px; padding-right: 4px; }
  .btn.claim { background: var(--ready); color: #fff; }
  .btn.wide { width: 100%; padding: 13px; }
  .btn:disabled { opacity: 0.55; cursor: default; }

  /* Forms */
  .form { background: var(--surface); border-radius: var(--radius); padding: 14px; display: grid; gap: 14px; }
  label.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  label.field .hint { font-weight: 400; }
  input[type="text"], input[type="password"], select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  }
  textarea { resize: vertical; min-height: 84px; }

  .empty { padding: 18px 14px; color: var(--hint); }
  .pass { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--surface); border-radius: var(--radius); padding: 14px; }

  #auth { display: none; }
  body.needs-auth #auth { display: block; }
  body.needs-auth #app { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    max-width: calc(100% - 32px); transition: opacity 0.2s, transform 0.2s; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--bad); color: #fff; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .sweep, .icon-btn.spinning svg { animation: none; }
    .toast, .switch .thumb, .switch .track { transition: none; }
  }
  @media (max-width: 360px) {
    .radar-wrap { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .switch-row { justify-content: center; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Mining Radar</h1>
      <p class="hint" id="updated">Loading…</p>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <!-- Shown only when the API rejects the request -->
  <div id="auth">
    <div class="form">
      <h2>Sign in to your dashboard</h2>
      <p class="hint" id="authMsg">Open this dashboard from your bot with /dashboard, or enter your dashboard API key.</p>
      <label class="field">API key
        <input type="password" id="apiKeyInput" autocomplete="off" placeholder="DASHBOARD_API_KEY from Render">
      </label>
      <button class="btn" id="apiKeyBtn">Sign in</button>
    </div>
  </div>

  <div id="app">
    <div class="radar-wrap">
      <div class="radar" id="radar" aria-hidden="true">
        <div class="sweep"></div>
        <div class="radar-center"><div><strong id="readyCount">–</strong><span>ready</span></div></div>
      </div>
      <div class="summary">
        <h2 id="summaryTitle">Scanning…</h2>
        <p class="hint" id="summaryLine"></p>
        <label class="switch-row">
          <span class="switch">
            <input type="checkbox" id="radarToggle" role="switch">
            <span class="track"></span><span class="thumb"></span>
          </span>
          <span id="radarToggleLabel">Radar on</span>
        </label>
      </div>
    </div>

    <div id="accounts"></div>

    <section>
      <div class="section-head"><h2>Settings</h2></div>
      <div class="form">
        <label class="field">Check every
          <select id="interval">
            <option value="300">5 minutes</option>
            <option value="600">10 minutes</option>
            <option value="900">15 minutes</option>
            <option value="1800">30 minutes</option>
            <option value="3600">1 hour</option>
          </select>
        </label>
        <label class="field">Mining bots
          <span class="hint">One username per line, e.g. @UltrawalletTrade_Bot</span>
          <textarea id="bots" spellcheck="false"></textarea>
        </label>
        <label class="field">Cycle timers
          <span class="hint">For bots that never message you. One per line: bot = hours, e.g. @ATF_AIRDROP_bot = 8. Leave a bot out to read its messages instead.</span>
          <textarea id="cycleTimers" spellcheck="false" placeholder="@ATF_AIRDROP_bot = 8&#10;@mrgminerbot = 24"></textarea>
        </label>
        <label class="field">Words that mean "ready"
          <span class="hint">Comma separated. If a bot's reply contains one of these, you get an alert.</span>
          <input type="text" id="readyWords" spellcheck="false">
        </label>
        <label class="field">Words that mean "still mining"
          <span class="hint">Comma separated. These win over the ready words. Countdowns like 17:35:17 are detected automatically.</span>
          <input type="text" id="notReadyWords" spellcheck="false">
        </label>
        <label class="field">Treat "ready" messages as old after
          <span class="hint">If you claim inside the app, the bot can't see it. After this long, an old "ready" message stops counting. Tap "Mark claimed" to clear it sooner.</span>
          <select id="readyValid">
            <option value="2">2 hours</option>
            <option value="6">6 hours</option>
            <option value="12">12 hours</option>
            <option value="24">24 hours</option>
          </select>
        </label>
        <button class="btn" id="saveBtn">Save settings</button>
      </div>
    </section>

    <section>
      <div class="pass">
        <div>
          <h2>Pro Pass</h2>
          <p class="hint">30 days of cloud radar and dashboard access</p>
        </div>
        <button class="btn" id="buyBtn">Buy with ⭐</button>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = (tg && tg.initData) || "";
  if (tg) { tg.ready(); tg.expand(); }

  let apiKey = "";
  try { apiKey = localStorage.getItem("radar_api_key") || ""; } catch (e) {}

  const $ = (id) => document.getElementById(id);
  let lastLoaded = 0;
  let loading = false;

  // ---------- helpers ----------
  function toast(msg, isError = false) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.toggle("error", isError);
    t.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove("show"), 3200);
    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred(isError ? "error" : "success");
    }
  }

  function headers() {
    const h = { "Content-Type": "application/json" };
    if (initData) h["X-Telegram-Init-Data"] = initData;
    if (apiKey) h["X-API-Key"] = apiKey;
    return h;
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: headers() });
    if (res.status === 401) { showAuth(); throw new Error("Not signed in"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
    return data;
  }

  function showAuth() {
    document.body.classList.add("needs-auth");
    $("updated").textContent = "Not signed in";
    $("authMsg").textContent = initData
      ? "Your Telegram account isn't on this bot's allowed list. Add your user ID to ALLOWED_USERS on Render, or sign in with the API key."
      : "Open this dashboard from your bot with /dashboard, or enter your dashboard API key.";
  }

  function timeUntil(ts) {
    const s = Math.max(0, Math.floor(ts - Date.now() / 1000));
    const hrs = Math.floor(s / 3600), mins = Math.floor((s % 3600) / 60);
    return hrs ? `${hrs}h ${mins}m` : `${Math.max(mins, 1)} min`;
  }

  function timeAgo(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return `${Math.floor(s / 86400)} d ago`;
  }

  const STATUS = {
    "READY TO CLAIM": { cls: "ready", label: "Ready to claim" },
    "MINING IN PROGRESS": { cls: "mining", label: "Mining" },
    "NO REPLY": { cls: "bad", label: "No reply" },
    "UNKNOWN": { cls: "bad", label: "Unclear message" },
    "NO MESSAGES": { cls: "bad", label: "No messages yet" },
    "CLAIMED": { cls: "done", label: "Claimed" },
    "TIMER NOT STARTED": { cls: "bad", label: "Timer not started" },
    "STALE READY": { cls: "mining", label: "Old ready message" },
  };
  const statusInfo = (s) => STATUS[s] || { cls: "bad", label: s || "Unknown" };

  function openLink(url) {
    if (tg && url.startsWith("https://t.me/")) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank", "noopener");
  }

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;   // textContent keeps bot replies from injecting HTML
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
    children.forEach((c) => c && node.appendChild(c));
    return node;
  }

  // ---------- rendering ----------
  function renderRadar(records, radarOn) {
    const radar = $("radar");
    radar.querySelectorAll(".blip").forEach((b) => b.remove());
    radar.classList.toggle("off", !radarOn);

    const ready = records.filter((r) => r.info.status === "READY TO CLAIM").length;
    $("readyCount").textContent = String(ready);

    records.forEach((r, i) => {
      const angle = (i / Math.max(records.length, 1)) * 2 * Math.PI - Math.PI / 2;
      const radius = 0.36;
      const blip = el("span", { class: "blip " + statusInfo(r.info.status).cls });
      blip.style.left = `${50 + Math.cos(angle) * radius * 100}%`;
      blip.style.top = `${50 + Math.sin(angle) * radius * 100}%`;
      radar.appendChild(blip);
    });

    if (!records.length) {
      $("summaryTitle").textContent = "No checks yet";
      $("summaryLine").textContent = "The first scan runs a few seconds after the bot starts.";
    } else {
      const mining = records.filter((r) => ["MINING IN PROGRESS", "CLAIMED", "STALE READY"].includes(r.info.status)).length;
      const problems = records.length - ready - mining;
      $("summaryTitle").textContent = ready ? `${ready} ready to claim` : "All bots mining";
      const parts = [`${mining} mining`];
      if (problems) parts.push(`${problems} need attention`);
      $("summaryLine").textContent = parts.join(", ");
    }
  }

  function renderAccounts(accounts) {
    const root = $("accounts");
    root.replaceChildren();
    const labels = Object.keys(accounts).sort();

    if (!labels.length) {
      root.appendChild(el("section", {}, [
        el("div", { class: "list" }, [
          el("p", { class: "empty", text: "No account has reported yet. Check that SESSION_STRING_ONE is set on Render and watch the logs for \"Mini-App Radar started\"." }),
        ]),
      ]));
      return;
    }

    labels.forEach((label) => {
      const bots = accounts[label];
      const accountId = parseInt((label.match(/\d+/) || ["0"])[0], 10);

      const checkBtn = el("button", { class: "btn small", text: "Check now" });
      checkBtn.addEventListener("click", () => forceCheck(accountId, checkBtn));

      const list = el("div", { class: "list" });
      Object.keys(bots).sort().forEach((botName) => {
        const info = bots[botName];
        const st = statusInfo(info.status);
        const claimUrl = info.button_url || `https://t.me/${botName.replace(/^@/, "")}`;

        const openBtn = st.cls === "ready"
          ? el("button", { class: "btn small claim", text: "Open & claim", onclick: () => openLink(claimUrl) })
          : el("button", { class: "btn small quiet", text: "Open bot", onclick: () => openLink(claimUrl) });
        const isTimer = info.mode === "timer";
        const canMark = isTimer || info.status === "READY TO CLAIM" || info.status === "STALE READY";
        const markBtn = canMark
          ? el("button", { class: "btn small quiet", text: isTimer ? "Claimed now" : "Mark claimed" })
          : null;
        if (markBtn) markBtn.addEventListener("click", () => markClaimed(label, botName, markBtn));
        const actions = el("div", { class: "row-actions" }, [markBtn, openBtn]);

        const reply = isTimer
          ? null
          : info.last_response
          ? el("details", { class: "reply" }, [
              el("summary", { text: "Latest message" }),
              el("pre", { text: info.last_response }),
            ])
          : el("span", { class: "hint", text: "No text in latest message" });

        list.appendChild(el("div", { class: "row" }, [
          el("div", { class: "row-main" }, [
            el("span", { class: "row-name", text: botName }),
            el("span", { class: "status " + st.cls, text: st.label }),
          ]),
          el("div", { class: "row-meta" }, [
            el("span", { class: "hint", text: metaText(info) }),
            actions,
          ]),
          el("div", { style: "margin-top:6px" }, [reply]),
        ]));
      });

      root.appendChild(el("section", {}, [
        el("div", { class: "section-head" }, [el("h2", { text: label }), checkBtn]),
        list,
      ]));
    });
  }

  function metaText(info) {
    if (info.mode === "timer") {
      if (!info.claimed_at) return `${info.cycle_hours}h timer · tap "Claimed now" after you claim`;
      if (info.status === "READY TO CLAIM") return `Ready since ${timeAgo(info.ready_at)}`;
      return `Ready in ${timeUntil(info.ready_at)} · ${info.cycle_hours}h cycle`;
    }
    return info.message_time
      ? `Bot messaged ${timeAgo(info.message_time)} · checked ${timeAgo(info.timestamp)}`
      : `Checked ${timeAgo(info.timestamp)}`;
  }

  function fillSettings(s) {
    const interval = $("interval");
    const val = String(s.polling_interval);
    if (![...interval.options].some((o) => o.value === val)) {
      interval.appendChild(el("option", { value: val, text: `${Math.round(s.polling_interval / 60)} minutes` }));
    }
    interval.value = val;
    $("bots").value = (s.active_bots || []).join("\n");
    $("readyWords").value = (s.ready_keywords || []).join(", ");
    $("cycleTimers").value = Object.entries(s.cycle_hours || {}).map(([b, hrs]) => `${b} = ${hrs}`).join("\n");
    $("notReadyWords").value = (s.not_ready_keywords || []).join(", ");
    const rv = $("readyValid");
    const rvVal = String(Number(s.ready_valid_hours || 12));
    if (![...rv.options].some((o) => o.value === rvVal)) rv.appendChild(el("option", { value: rvVal, text: `${rvVal} hours` }));
    rv.value = rvVal;
    $("radarToggle").checked = !!s.auto_claim_enabled;
    $("radarToggleLabel").textContent = s.auto_claim_enabled ? "Radar on" : "Radar paused";
  }

  // ---------- actions ----------
  async function load(silent = false) {
    if (loading) return;
    loading = true;
    $("refreshBtn").classList.add("spinning");
    try {
      const [status, settings] = await Promise.all([api("/api/mining-status"), api("/api/settings")]);
      document.body.classList.remove("needs-auth");
      const accounts = status.accounts || {};
      const records = [];
      Object.keys(accounts).forEach((a) =>
        Object.keys(accounts[a]).forEach((b) => records.push({ account: a, bot: b, info: accounts[a][b] }))
      );
      renderRadar(records, settings.settings.auto_claim_enabled);
      renderAccounts(accounts);
      if (!document.activeElement || !document.activeElement.closest(".form")) {
        fillSettings(settings.settings);  // don't overwrite fields while you're typing
      }
      lastLoaded = Date.now();
      updateStamp();
    } catch (e) {
      if (e.message !== "Not signed in" && !silent) toast(e.message, true);
    } finally {
      loading = false;
      $("refreshBtn").classList.remove("spinning");
    }
  }

  function updateStamp() {
    if (lastLoaded) $("updated").textContent = `Updated ${timeAgo(lastLoaded / 1000)}`;
  }

  async function forceCheck(accountId, btn) {
    btn.disabled = true;
    btn.textContent = "Checking…";
    try {
      const data = await api(`/api/action/${accountId}/force_check`, { method: "POST" });
      const ready = Object.values(data.results || {}).filter((s) => s === "READY TO CLAIM").length;
      toast(ready ? `${ready} bot(s) ready to claim` : "Check finished. Nothing ready yet.");
      await load(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Check now";
    }
  }

  async function markClaimed(account, bot, btn) {
    btn.disabled = true;
    try {
      await api("/api/mark-claimed", { method: "POST", body: JSON.stringify({ account, bot }) });
      toast(`${bot} marked as claimed`);
      await load(true);
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
    }
  }

  async function saveSettings(partial, successMsg) {
    const data = await api("/api/settings", { method: "POST", body: JSON.stringify(partial) });
    fillSettings(data.settings);
    toast(successMsg);
    return data;
  }

  $("saveBtn").addEventListener("click", async () => {
    const btn = $("saveBtn");
    const splitWords = (v) => v.split(",").map((w) => w.trim()).filter(Boolean);
    const bots = $("bots").value.split(/[\n,]/).map((b) => b.trim()).filter(Boolean);
    if (!bots.length) { toast("Add at least one mining bot.", true); return; }
    const cycles = {};
    for (const line of $("cycleTimers").value.split("\n")) {
      if (!line.trim()) continue;
      const m = line.match(/^\s*@?([A-Za-z0-9_]+)\s*[=:]\s*([\d.]+)/);
      if (!m) { toast(`Can't read timer line: "${line.trim()}"`, true); return; }
      cycles["@" + m[1]] = Number(m[2]);
    }
    btn.disabled = true;
    try {
      await saveSettings({
        polling_interval: parseInt($("interval").value, 10),
        active_bots: bots,
        ready_keywords: splitWords($("readyWords").value),
        not_ready_keywords: splitWords($("notReadyWords").value),
        ready_valid_hours: Number($("readyValid").value),
        cycle_hours: cycles,
      }, "Settings saved");
      document.activeElement && document.activeElement.blur();
      load(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  $("radarToggle").addEventListener("change", async (ev) => {
    const on = ev.target.checked;
    try {
      await saveSettings({ auto_claim_enabled: on }, on ? "Radar on" : "Radar paused");
      $("radar").classList.toggle("off", !on);
    } catch (e) {
      ev.target.checked = !on;
      toast(e.message, true);
    }
  });

  $("buyBtn").addEventListener("click", async () => {
    const btn = $("buyBtn");
    btn.disabled = true;
    try {
      const data = await api("/api/create-invoice", { method: "POST" });
      if (tg && tg.openInvoice) {
        tg.openInvoice(data.invoice_link, (status) => {
          if (status === "paid") toast("Pro Pass activated");
          else if (status === "failed") toast("Payment failed. Try again.", true);
        });
      } else {
        window.open(data.invoice_link, "_blank", "noopener");
      }
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  $("refreshBtn").addEventListener("click", () => load());

  $("apiKeyBtn").addEventListener("click", () => {
    apiKey = $("apiKeyInput").value.trim();
    try { localStorage.setItem("radar_api_key", apiKey); } catch (e) {}
    load();
  });

  // ---------- start ----------
  load();
  setInterval(() => load(true), 30000);
  setInterval(updateStamp, 15000);
})();
</script>
</body>
</html>
