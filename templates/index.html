<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mining Radar Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 12px; }
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; background: var(--tg-theme-secondary-bg-color, #1e1e1e); color: var(--tg-theme-text-color, #ffffff);
            border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }
        .tab-btn.active { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); }
        .panel { display: none; }
        .panel.active { display: block; }
        .account-card, .settings-card {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 12px; padding: 14px; margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .account-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; color: #4ade80; }
        .bot-item { margin: 6px 0; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem; }
        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        button.action-btn {
            flex: 1; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 10px 8px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #a3a3a3; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); color: #fff; box-sizing: border-box;
        }
        #status-msg { text-align: center; font-size: 0.85rem; margin-top: 10px; color: #4ade80; }
    </style>
</head>
<body>

    <h1>🚀 Mining Radar</h1>
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ Settings</button>
        <button class="tab-btn" onclick="switchTab('billing')">⭐ Upgrade</button>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="dashboard-panel" class="panel active">
        <div id="dashboard-container">Loading accounts...</div>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="panel">
        <div class="settings-card">
            <div class="account-title">🛠️ Radar Configuration</div>
            <div class="form-group">
                <label>Polling Interval (Seconds)</label>
                <input type="number" id="setting-interval" value="900">
            </div>
            <div class="form-group">
                <label>Auto-Claim Enabled</label>
                <select id="setting-autoclaim">
                    <option value="true">Enabled (Auto-Click)</option>
                    <option value="false">Disabled (Alert Only)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Target Bot Usernames (Comma Separated)</label>
                <input type="text" id="setting-bots" value="@UltrawalletTrade_Bot, @ATF_AIRDROP_bot">
            </div>
            <button class="action-btn" onclick="saveSettings()" style="width: 100%; margin-top: 8px;">💾 Save Changes</button>
        </div>
    </div>

    <!-- BILLING PANEL -->
    <div id="billing-panel" class="panel">
        <div class="settings-card" style="text-align: center;">
            <div class="account-title">⭐ Pro Automation Pass</div>
            <p style="font-size: 0.85rem; color: #a3a3a3;">Get 24/7 uninterrupted cloud mining radar execution, auto-claim clickers, and priority polling.</p>
            <h2 style="color: #facc15; margin: 12px 0;">150 Stars / Month</h2>
            <button class="action-btn" onclick="buySubscription()" style="background: #facc15; color: #000; width: 100%;">Pay with Telegram Stars</button>
        </div>
    </div>

    <div id="status-msg"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabName) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (tabName === 'dashboard') {
                document.getElementById('dashboard-panel').classList.add('active');
                event.target.classList.add('active');
                fetchStatus();
            } else if (tabName === 'settings') {
                document.getElementById('settings-panel').classList.add('active');
                event.target.classList.add('active');
                fetchSettings();
            } else if (tabName === 'billing') {
                document.getElementById('billing-panel').classList.add('active');
                event.target.classList.add('active');
            }
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/mining-status');
                const data = await response.json();
                renderDashboard(data.accounts);
            } catch (err) {
                document.getElementById('dashboard-container').innerHTML = '<p style="color:red; text-align:center;">Failed to load status.</p>';
            }
        }

        function renderDashboard(accounts) {
            const container = document.getElementById('dashboard-container');
            if (!accounts || Object.keys(accounts).length === 0) {
                container.innerHTML = '<p style="text-align:center;">No mining accounts currently active.</p>';
                return;
            }

            let html = '';
            for (const [accountLabel, bots] of Object.entries(accounts)) {
                const accountId = accountLabel.includes('2') ? 2 : 1;
                html += `<div class="account-card"><div class="account-title">👤 ${accountLabel}</div>`;
                
                for (const [botName, info] of Object.entries(bots)) {
                    html += `<div class="bot-item">
                        <strong>${botName}</strong><br>
                        Status: <span>${info.status}</span><br>
                        <small>Last: ${info.last_response || 'N/A'}</small>
                    </div>`;
                }

                html += `<div class="btn-group">
                            <button class="action-btn" onclick="triggerAction(${accountId}, 'force_check')">⚡ Force Status</button>
                            <button class="action-btn" onclick="triggerAction(${accountId}, 'restart_mining')">🔄 Sync Bot</button>
                         </div></div>`;
            }
            container.innerHTML = html;
        }

        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('setting-interval').value = data.settings.polling_interval;
                    document.getElementById('setting-autoclaim').value = data.settings.auto_claim_enabled ? "true" : "false";
                    document.getElementById('setting-bots').value = data.settings.active_bots.join(", ");
                }
            } catch (err) {
                console.error("Failed to load settings");
            }
        }

        async function saveSettings() {
            const msgEl = document.getElementById('status-msg');
            msgEl.innerText = "Saving settings...";
            
            const interval = document.getElementById('setting-interval').value;
            const autoClaim = document.getElementById('setting-autoclaim').value === 'true';
            const bots = document.getElementById('setting-bots').value.split(',').map(b => b.trim());

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ polling_interval: interval, auto_claim_enabled: autoClaim, active_bots: bots })
                });
                const result = await res.json();
                msgEl.innerText = result.message || "Settings updated successfully!";
                setTimeout(() => { msgEl.innerText = ""; }, 3000);
            } catch (err) {
                msgEl.innerText = "Error saving settings.";
            }
        }

        async function buySubscription() {
            const msgEl = document.getElementById('status-msg');
            msgEl.innerText = "Generating invoice...";
            try {
                const res = await fetch('/api/create-invoice', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success' && data.invoice_link) {
                    msgEl.innerText = "";
                    tg.openInvoice(data.invoice_link, (status) => {
                        if (status === 'paid') {
                            alert("Payment successful! Thank you for subscribing.");
                        }
                    });
                } else {
                    msgEl.innerText = "Could not generate invoice link.";
                }
            } catch (err) {
                msgEl.innerText = "Error processing payment request.";
            }
        }

        async function triggerAction(accountId, actionType) {
            const msgEl = document.getElementById('status-msg');
            msgEl.innerText = `Executing ${actionType} for Account-${accountId}...`;
            try {
                const res = await fetch(`/api/action/${accountId}/${actionType}`, { method: 'POST' });
                const result = await res.json();
                msgEl.innerText = result.message || 'Action executed successfully!';
                setTimeout(() => { msgEl.innerText = ""; fetchStatus(); }, 3000);
            } catch (err) {
                msgEl.innerText = 'Error executing action.';
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 15000);
    </script>
</body>
</html>
