<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mining Radar Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; }
        .account-card {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .account-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; color: #4ade80; }
        .bot-item { margin: 6px 0; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem; }
        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        button {
            flex: 1;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        #status-msg { text-align: center; font-size: 0.85rem; margin-top: 10px; color: #a3a3a3; }
    </style>
</head>
<body>

    <h1>🚀 Mining Radar Dashboard</h1>
    <div id="dashboard-container">Loading accounts...</div>
    <div id="status-msg"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchStatus() {
            try {
                const response = await fetch('/api/mining-status');
                const data = await response.json();
                renderDashboard(data.accounts);
            } catch (err) {
                document.getElementById('dashboard-container').innerHTML = '<p style="color:red; text-align:center;">Failed to load status.</p>';
            }
        }

        function renderDashboard(accounts) {
            const container = document.getElementById('dashboard-container');
            if (!accounts || Object.keys(accounts).length === 0) {
                container.innerHTML = '<p style="text-align:center;">No mining accounts currently active.</p>';
                return;
            }

            let html = '';
            for (const [accountLabel, bots] of Object.entries(accounts)) {
                // Extract account number ID (e.g., "Account-1" -> 1)
                const accountId = accountLabel.includes('2') ? 2 : 1;
                
                html += `<div class="account-card">
                    <div class="account-title">👤 ${accountLabel}</div>`;
                
                for (const [botName, info] of Object.entries(bots)) {
                    html += `<div class="bot-item">
                        <strong>${botName}</strong><br>
                        Status: <span>${info.status}</span><br>
                        <small>Last: ${info.last_response || 'N/A'}</small>
                    </div>`;
                }

                // --- TRIGGER BUTTONS ADDED HERE ---
                html += `<div class="btn-group">
                            <button onclick="triggerAction(${accountId}, 'force_check')">⚡ Force Status</button>
                            <button onclick="triggerAction(${accountId}, 'restart_mining')">🔄 Sync Bot</button>
                         </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        async function triggerAction(accountId, actionType) {
            const msgEl = document.getElementById('status-msg');
            msgEl.innerText = `Executing ${actionType} for Account-${accountId}...`;
            try {
                const res = await fetch(`/api/action/${accountId}/${actionType}`, { method: 'POST' });
                const result = await res.json();
                msgEl.innerText = result.message || 'Action executed successfully!';
                setTimeout(fetchStatus, 3000); 
            } catch (err) {
                msgEl.innerText = 'Error executing action.';
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 15000);
    </script>
</body>
</html>
